plugins {
    id 'com.android.library'
}

// 能力层：配置解析 / spider 加载 / 搜索聚合 / 播放解析 / 存储 / 本地服务
// 约束：不得依赖任何 UI（Activity / Fragment / Adapter / R.xxx 布局）
android {
    namespace 'com.tvdesk.core'
    compileSdk 35

    defaultConfig {
        minSdkVersion 19
        targetSdkVersion 28
        multiDexEnabled true
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
    }
}

dependencies {
    // app/libs 里的 jar 由 app 负责打包，core 只在编译期引用，避免重复类
    compileOnly files(rootProject.file('app/libs/commons-lang3-3.12.0.jar'))
    compileOnly files(rootProject.file('app/libs/thunder.jar'))
    compileOnly files(rootProject.file('app/libs/xwalk_shared_library-23.53.589.4.aar'))

    api 'androidx.annotation:annotation:1.3.0'
    api 'androidx.appcompat:appcompat:1.3.0'
    api 'androidx.recyclerview:recyclerview:1.2.1'

    api 'com.squareup.okhttp3:okhttp:3.12.11'
    api 'com.squareup.okio:okio:2.8.0'
    api 'com.google.code.gson:gson:2.10.1'
    api 'org.jsoup:jsoup:1.14.1'
    api 'com.orhanobut:hawk:2.0.1'
    api 'org.greenrobot:eventbus:3.2.0'
    api 'org.nanohttpd:nanohttpd:2.3.1'
    api 'com.google.zxing:core:3.3.0'
    api 'commons-io:commons-io:2.11.0'
    api 'com.googlecode.juniversalchardet:juniversalchardet:1.0.3'
    api('com.thoughtworks.xstream:xstream:1.4.15') {
        exclude group: 'xmlpull', module: 'xmlpull'
    }
    api 'androidx.multidex:multidex:2.0.1'

    api 'com.github.bumptech.glide:glide:4.16.0'
    api 'com.squareup.picasso:picasso:2.71828'
    api 'com.github.ctiao:DanmakuFlameMaster:0.9.25'

    api 'com.lzy.net:okgo:3.0.4'
    api 'com.github.getActivity:XXPermissions:13.6'
    api 'me.jessyan:autosize:1.2.1'

    api 'androidx.room:room-runtime:2.3.0'
    annotationProcessor 'androidx.room:room-compiler:2.3.0'

    // http3
    api 'com.google.net.cronet:cronet-okhttp:0.1.0'
    api 'org.chromium.net:cronet-embedded:101.4951.41'
    api 'org.brotli:dec:0.1.2'

    api project(':player')
    api project(':quickjs')
}
