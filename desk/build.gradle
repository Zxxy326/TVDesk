plugins {
    id 'com.android.library'
}

// 桌面层：TVDesk 自绘桌面 / 焦点引擎 / 四个模块的入口
// 约束：只依赖 core 的能力接口，不直接引用 app 里的任何类
android {
    namespace 'com.tvdesk.desk'
    compileSdk 35

    defaultConfig {
        minSdkVersion 19
        targetSdkVersion 28
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
    }
}

dependencies {
    api project(':core')
    api 'androidx.annotation:annotation:1.3.0'
    api 'androidx.appcompat:appcompat:1.3.0'
    api 'androidx.recyclerview:recyclerview:1.2.1'
}
